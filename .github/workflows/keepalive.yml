name: keep-tarxien-awake
on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub may add a few minutes of jitter; fine for a 15-min spin-down
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the instance
        env:
          URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then echo "RENDER_URL secret not set - nothing to ping yet"; exit 0; fi
          code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "$URL")
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
